# Monitoring stack — Prometheus + Grafana + node_exporter (global, all nodes).
#
# node_exporter mounts a textfile_collector directory populated by
# scripts/gluster-heal-check.sh (see ../../scripts/), which is how GlusterFS
# health gets exposed to Prometheus without a native exporter.
#
# Secrets come from environment variables exported from .env before
# `docker stack deploy` (stack deploy does not read .env on its own), see
# docs/deployment.md.
version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/monitoring/prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - proxy-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.entrypoints=prometheus"
        - "traefik.http.routers.prometheus.rule=PathPrefix(`/`)"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=Grafana Infra Alerts
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
    volumes:
      - /opt/monitoring/grafana-data:/var/lib/grafana
    networks:
      - proxy-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.entrypoints=grafana"
        - "traefik.http.routers.grafana.rule=PathPrefix(`/`)"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - target: 9100
        published: 9100
        mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile_collector:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/textfile_collector'
    networks:
      - proxy-net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

networks:
  proxy-net:
    external: true
