# Nextcloud — self-hosted file sync/share, backed by MariaDB + Redis.
#
# All three services are pinned to node.labels.glusterfs == true, which
# matters more here than for any other stack: MariaDB writing to a GlusterFS
# mount while the volume is mid-heal is exactly the scenario that risks
# corruption/duplication. The placement constraint guarantees Nextcloud's
# app/db/redis triad only ever schedules onto nodes that are GlusterFS peers
# in the first place — see docs/incident-reports for the reasoning this
# constraint was built to prevent.
#
# Before starting/restarting this stack after any outage, always confirm
# `gluster volume heal swarm-data info summary` shows 0 pending entries on
# both bricks first — see docs/runbooks/safe-shutdown-startup.md.
version: "3.8"

services:
  nextcloud:
    image: nextcloud:29-apache
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=${NEXTCLOUD_DB_NAME}
      - MYSQL_USER=${NEXTCLOUD_DB_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_TRUSTED_DOMAINS=${MANAGER_TAILSCALE_IP}
    volumes:
      - /mnt/gluster/nextcloud/html:/var/www/html
    networks:
      - proxy-net
      - nextcloud-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.glusterfs == true
      restart_policy:
        condition: on-failure
        delay: 15s
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.nextcloud.entrypoints=web"
        - "traefik.http.routers.nextcloud.rule=PathPrefix(`/`)"
        - "traefik.http.services.nextcloud.loadbalancer.server.port=80"

  nextcloud-db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${NEXTCLOUD_DB_NAME}
      - MYSQL_USER=${NEXTCLOUD_DB_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - /mnt/gluster/nextcloud/db:/var/lib/mysql
    networks:
      - nextcloud-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.glusterfs == true
      restart_policy:
        condition: on-failure

  nextcloud-redis:
    image: redis:7.2-alpine
    networks:
      - nextcloud-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.glusterfs == true
      restart_policy:
        condition: on-failure

networks:
  proxy-net:
    external: true
  nextcloud-internal:
    driver: overlay
